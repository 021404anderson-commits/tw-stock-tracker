name: 每日更新

on:
  schedule:
    - cron: "37 7 * * 1-5"   # 台北時間 15:37（收盤後）
    - cron: "7 10 * * 1-5"   # 台北時間 18:07（補抓，官方資料有時傍晚才更新）
    - cron: "7 13 * * 1-5"   # 台北時間 21:07（再補一次）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
      - name: 存回資料
        run: |
          git config user.name "tw-stock-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
          git push
