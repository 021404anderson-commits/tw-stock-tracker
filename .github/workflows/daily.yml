name: 每日更新

on:
  schedule:
    - cron: "37 7 * * 1-5"   # 台北時間 15:37（收盤後）
    - cron: "7 10 * * 1-5"   # 台北時間 18:07（補抓，官方資料有時傍晚才更新）
    - cron: "7 13 * * 1-5"   # 台北時間 21:07（再補一次）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update   # 與盤中更新排隊執行，避免同時寫入
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py --intraday && python fetch.py && python -c "import json;d=json.load(open('data/latest.json'));print('CHK',d['trade_date'],d['problems'],{k:v['date'] for k,v in d['indices'].items()},d['stocks']['2330']);i=json.load(open('data/intraday.json'));print('CHK',i['time'],len(i['stocks']))"
