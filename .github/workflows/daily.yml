name: 每日更新

on:
  # 主要由 cron-job.org 準時觸發（見 README）；GitHub 內建排程常延遲數小時，留作備援
  schedule:
    - cron: "37 7 * * 1-5"   # 台北時間 15:37（收盤後）
    - cron: "37 10 * * 1-5"  # 台北時間 18:37（補抓，官方資料有時傍晚才更新）
    - cron: "37 13 * * 1-5"  # 台北時間 21:37（再補一次）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update   # 與盤中更新排隊執行，避免同時寫入
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
      - name: 存回資料
        run: |
          git config user.name "tw-stock-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
