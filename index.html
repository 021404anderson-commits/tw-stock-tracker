<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股每日追蹤系統</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mute:#6f6c66;--line:#e4e1d9;--up:#c8322b;--down:#1d8a4e;--flat:#6f6c66;--accent:#2b4a7a}
@media(prefers-color-scheme:dark){:root{--bg:#141412;--card:#1e1d1b;--ink:#eceae4;--mute:#9a968d;--line:#32302c;--up:#ff6b61;--down:#3fc67c;--flat:#9a968d;--accent:#8fb0e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:2px 0 16px}
.warn{background:color-mix(in srgb,var(--up) 12%,var(--card));border:1px solid var(--up);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.idx .n{color:var(--mute);font-size:13px}
.idx .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chg{font-variant-numeric:tabular-nums;font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
h2{font-size:13px;color:var(--mute);font-weight:600;margin:20px 0 8px;letter-spacing:.04em}
.stock{margin-bottom:8px;padding:0;overflow:hidden}
.stock summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;align-items:center}
.stock summary::-webkit-details-marker{display:none}
.nm{font-weight:600}.cd{color:var(--mute);font-size:12px;margin-left:6px;font-variant-numeric:tabular-nums}
.px{font-size:18px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.pos{grid-column:1;color:var(--mute);font-size:12.5px}
.stock .chg{text-align:right}
.spark{display:block;width:100%;height:34px;margin-top:6px}
.body{border-top:1px solid var(--line);padding:12px 14px;font-size:13.5px}
.body dt{color:var(--mute);font-size:12px;margin-top:10px}.body dt:first-child{margin-top:0}
.body dd{margin:2px 0 0}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0;background:var(--line)}
.bar i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.leg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.todo{color:var(--mute);font-style:italic}
.cal{font-size:13.5px}
.cal div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.cal div:last-child{border:0}
.cal time{font-variant-numeric:tabular-nums;color:var(--accent);min-width:86px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search input::placeholder{color:var(--mute)}
.hint{color:var(--mute);font-size:12.5px;margin:6px 2px 0;min-height:18px}
[hidden]{display:none!important}
.rk{padding:2px 14px}
.rk button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.rk button:last-child{border:0}
.rk button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.rk .no{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.rk .g{font-weight:600}
.rk .pc{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.rk .dt{grid-column:2/4;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 12px}
.note{color:var(--mute);font-size:12px;margin:6px 2px 0}
a{color:var(--accent)}
footer{color:var(--mute);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>台股每日追蹤系統</h1>
<p class="sub" id="sub">載入中…</p>
<div id="warn"></div>
<div class="search" role="search">
<input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="搜尋公司、代號或法說會日期" aria-describedby="hint" placeholder="搜尋：公司名稱、代號，或法說會日期（如 11/12、11月）">
<div class="hint" id="hint" aria-live="polite"></div>
</div>
<section class="idx" id="idx"></section>
<h2 id="rkh" hidden>族群強弱排名</h2>
<section class="card rk" id="rk" hidden></section>
<p class="note" id="rkn" hidden></p>
<h2 id="calh">法說會</h2>
<section class="card cal" id="cal"></section>
<div id="stocks"></div>
<footer>行情與三大法人買賣超：臺灣證券交易所、證券櫃檯買賣中心公開資料，每個交易日收盤後自動更新。法說會與產品比重為人工整理並附來源，僅供研究參考，非投資建議。</footer>
</main>
<script>
const MIX=["#2b4a7a","#c98a2b","#4f8f7b","#a4567f","#7a6bb5","#8a8a8a"];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=n=>n==null?"—":n.toLocaleString("zh-TW",{maximumFractionDigits:2});
const cls=n=>n==null||n===0?"flat":n>0?"up":"down";
const chgText=(c,p)=>c==null?"—":`${c>0?"▲":c<0?"▼":""}${fmt(Math.abs(c))}（${p==null?"—":(p>0?"+":"")+p.toFixed(2)+"%"}）`;
async function j(p){try{const r=await fetch(p+"?t="+Date.now());return r.ok?await r.json():null}catch(e){return null}}
function spark(vals,up){
  const ns="http://www.w3.org/2000/svg",s=document.createElementNS(ns,"svg");s.setAttribute("class","spark");s.setAttribute("viewBox","0 0 100 34");s.setAttribute("preserveAspectRatio","none");
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const d=vals.map((v,i)=>`${i?"L":"M"}${(i/(vals.length-1)*100).toFixed(1)},${(31-(v-mn)/r*28).toFixed(1)}`).join("");
  const p=document.createElementNS(ns,"path");p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke",`var(--${up})`);p.setAttribute("stroke-width","1.5");p.setAttribute("vector-effect","non-scaling-stroke");s.append(p);return s}
const norm=t=>String(t||"").normalize("NFKC").toLowerCase().trim();
const p2=n=>String(n).padStart(2,"0");
// 把輸入的日期寫法轉成可比對 YYYY-MM-DD 的片段；不是日期就回傳 null
function dateKey(t){let m;
  if(m=t.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/))return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  if(m=t.match(/^(\d{4})[-\/.年](\d{1,2})月?$/))return `${m[1]}-${p2(m[2])}`;
  if(m=t.match(/^(\d{1,2})[-\/.月](\d{1,2})[日號]?$/))return `-${p2(m[1])}-${p2(m[2])}`;
  if(m=t.match(/^(\d{1,2})月$/))return `-${p2(m[1])}-`;
  if(m=t.match(/^(20\d{2})年$/))return m[1]+"-";
  return null}
(async()=>{
  const [wl,latest,hist,fund,flow,intra]=await Promise.all([j("watchlist.json"),j("data/latest.json"),j("data/history.json"),j("fundamentals.json"),j("data/flow.json"),j("data/intraday.json")]);
  const sub=document.getElementById("sub");
  if(!wl){sub.textContent="讀不到關注清單";return}
  const L=latest||{indices:{},stocks:{},problems:[]},H=hist||{},F=(fund&&fund.items)||{};
  const days=Object.keys(H).sort();
  // 盤中報價比收盤資料新的項目，用盤中報價蓋過（法人買賣超保留前一日）
  let live=false;
  if(intra&&intra.date){for(const [grp,src] of [["indices",intra.indices||{}],["stocks",intra.stocks||{}]])
    for(const k in src){const old=L[grp][k]||{};if(!old.date||src[k].date>old.date){L[grp][k]={...src[k],inst:old.inst};live=true}}}
  if(live){const t=(intra.time||"").slice(0,5),fin=t>="13:30";L.trade_date=intra.date;
    sub.textContent=`${intra.date} ${fin?"收盤":"盤中"} ${t}（即時報價${fin?"，官方盤後資料 15:37 後更新":"，非收盤價"}）`}
  else sub.textContent=latest?`交易日 ${L.trade_date||"—"}・更新於 ${(L.fetched_at||"").replace("T"," ").slice(0,16)}`:"尚未有行情資料（等待第一次自動更新）";
  if(L.problems&&L.problems.length){const w=el("div","warn",L.problems.join("；"));document.getElementById("warn").append(w)}
  const series=k=>days.map(d=>H[d][k]).filter(v=>v!=null).slice(-60);
  const idx=document.getElementById("idx");
  for(const i of wl.indices){const v=L.indices[i.id]||{},c=el("div","card");
    c.append(el("div","n",i.name+(v.date&&v.date!==L.trade_date?"（"+v.date.slice(5).replace("-","/")+"）":"")),el("div","v",fmt(v.close)),el("div","chg "+cls(v.change),chgText(v.change,v.pct)));
    const s=series(i.id);if(s.length>1)c.append(spark(s,cls(s[s.length-1]-s[0])));idx.append(c)}
  const cal=document.getElementById("cal"),today=new Date().toISOString().slice(0,10);
  const ev=wl.stocks.map(s=>({s,c:(F[s.code]||{}).conference})).filter(x=>x.c&&x.c.date).sort((a,b)=>a.c.date<b.c.date?-1:1);
  const upc=ev.filter(x=>x.c.date>=today),calh=document.getElementById("calh");
  function drawCal(show,title,empty){calh.textContent=title;cal.replaceChildren();
    if(!show.length)cal.append(el("span","todo",empty));
    for(const x of show){const r=el("div"),t=el("time",null,x.c.date);r.append(t,el("span",null,`${x.s.name}${x.c.note?"｜"+x.c.note:""}`));cal.append(r)}}
  const calDefault=()=>drawCal(upc.length?upc:ev.slice(-5),upc.length?"即將舉行的法說會":"最近的法說會（下一季日期尚未公布）","法說會日程整理中");
  calDefault();
  const box=document.getElementById("stocks"),rows=[],heads={};let g="";
  for(const s of wl.stocks){
    if(s.group!==g){g=s.group;heads[g]=el("h2",null,g);box.append(heads[g])}
    const v=L.stocks[s.code]||{},f=F[s.code]||{},d=el("details","card stock"),sm=el("summary");
    const n=el("div");n.append(el("span","nm",s.name),el("span","cd",s.code));
    if(v.date&&v.date!==L.trade_date)n.append(el("span","cd",v.date.slice(5).replace("-","/")+" 收盤"));
    sm.append(n,el("div","px",fmt(v.close)),el("div","pos",s.position),el("div","chg "+cls(v.change),chgText(v.change,v.pct)));
    d.append(sm);
    const b=el("div","body"),dl=el("dl");dl.style.margin=0;
    const ss=series(s.code);if(ss.length>1){b.append(spark(ss,cls(ss[ss.length-1]-ss[0])))}
    dl.append(el("dt",null,"今日"),el("dd",null,`開 ${fmt(v.open)}・高 ${fmt(v.high)}・低 ${fmt(v.low)}・量 ${v.volume==null?"—":fmt(Math.round(v.volume/1000))+" 張"}`));
    if(v.inst&&v.inst.total!=null){const I=v.inst,z=n=>n==null?"—":(n>0?"+":"")+fmt(Math.round(n/1000));
      dl.append(el("dt",null,`三大法人買賣超（${I.date.slice(5).replace("-","/")}・張）`),el("dd",null,`合計 ${z(I.total)}・外資 ${z(I.foreign)}・投信 ${z(I.trust)}・自營商 ${z(I.dealer)}`))}
    dl.append(el("dt",null,"供應鏈位置"),el("dd",null,s.position));
    dl.append(el("dt",null,"產品比重"+(f.mix_period?`（${f.mix_period}）`:"")));
    const dd=el("dd");
    if(f.product_mix&&f.product_mix.length){const bar=el("div","bar"),lg=el("div","leg");
      f.product_mix.forEach((m,i)=>{const seg=el("i");seg.style.width=m.pct+"%";seg.style.background=MIX[i%MIX.length];bar.append(seg);
        const it=el("span"),sw=el("b");sw.style.background=MIX[i%MIX.length];it.append(sw,document.createTextNode(`${m.name} ${m.pct}%`));lg.append(it)});
      dd.append(bar,lg)}else if(!f.mix_note)dd.append(el("span","todo","整理中"));
    if(f.mix_note)dd.append(el("div",null,f.mix_note));
    dl.append(dd);
    dl.append(el("dt",null,"法說會"));const cd=el("dd");
    if(f.conference&&f.conference.date){cd.textContent=`${f.conference.date}${f.conference.note?"｜"+f.conference.note:""}`}else cd.append(el("span","todo","整理中"));
    dl.append(cd);
    if(f.sources&&f.sources.length){dl.append(el("dt",null,"來源"));const sd=el("dd");
      f.sources.forEach((u,i)=>{const a=el("a",null,u.title||"連結");a.href=u.url;a.target="_blank";a.rel="noopener";if(i)sd.append("、");sd.append(a)});dl.append(sd)}
    b.append(dl);d.append(b);box.append(d);
    const c=f.conference||{};
    rows.push({s,d,date:c.date||"",hay:norm([s.name,s.code,s.group,s.position,f.mix_period,f.mix_note,c.note,(f.product_mix||[]).map(m=>m.name).join(" ")].filter(Boolean).join(" "))})}
  // ── 族群強弱排名：只用已發生的價格與資金數據，不做預測 ──
  (()=>{
    const FL=flow||{},fdays=Object.keys(FL).sort(),avg=a=>a.reduce((x,y)=>x+y,0)/a.length,md=d=>d.slice(5).replace("-","/");
    const names=[...new Set(wl.stocks.map(s=>s.group))];
    let pxDate="",inDate="";
    const G=names.map(name=>{
      const mem=wl.stocks.filter(s=>s.group===name).map(s=>s.code),o={name,n:mem.length};
      const pcs=mem.map(c=>(L.stocks[c]||{}).pct).filter(v=>v!=null);
      if(pcs.length===mem.length)o.pct=avg(pcs);
      mem.forEach(c=>{const d=(L.stocks[c]||{}).date;if(d&&d>pxDate)pxDate=d});
      // 法人買賣超金額（估）＝買賣超股數 × 當日收盤價；占比＝該金額 ÷ 當日成交金額
      let amt=0,val=0,ok=0;
      for(const c of mem){const v=L.stocks[c]||{},i=v.inst;if(!i||i.total==null)continue;
        const px=(H[i.date]||{})[c]??v.close,tv=((FL[i.date]||{})[c]||{}).v??v.value;if(px==null||!tv)continue;
        amt+=i.total*px;val+=tv;ok++;if(i.date>inDate)inDate=i.date}
      if(ok===mem.length){o.amt=amt;o.share=amt/val*100}
      // 近 5 日報酬：成分股各自的 5 個交易日漲跌幅取平均
      const r5=mem.map(c=>{const s=days.map(d=>H[d][c]).filter(v=>v!=null);return s.length>=6?(s[s.length-1]/s[s.length-6]-1)*100:null});
      if(r5.every(v=>v!=null))o.r5=avg(r5);
      // 量能：最新一日成交金額 ÷ 之前最多 20 日的平均
      const tot=fdays.map(d=>{const vs=mem.map(c=>((FL[d]||{})[c]||{}).v);return vs.every(v=>v!=null)?vs.reduce((x,y)=>x+y,0):null}).filter(v=>v!=null);
      if(tot.length>=4){const prev=tot.slice(-21,-1);o.vol=tot[tot.length-1]/avg(prev)}
      return o});
    if(!G.some(o=>o.pct!=null))return;
    // 綜合分數：每個指標在各族群間排名次，換成 0～1 後取平均；某指標只要有族群缺資料就整個不計
    const metrics=[["pct","當日漲跌"],["share","法人買賣超占成交比重"],["r5","近 5 日報酬"],["vol","量能變化"]],used=metrics.filter(([k])=>G.every(o=>o[k]!=null));
    for(const o of G){o.score=used.length?avg(used.map(([k])=>G.filter(x=>x[k]<o[k]).length/Math.max(1,G.length-1))):0}
    G.sort((a,b)=>b.score-a.score||(b.pct??-99)-(a.pct??-99));
    const rk=document.getElementById("rk"),sg=(n,d=2)=>(n>0?"+":"")+n.toFixed(d);
    G.forEach((o,i)=>{const b=el("button");b.type="button";b.title="點一下只看這個族群";
      b.append(el("span","no",i+1),el("span","g",o.name),el("span","pc "+cls(o.pct),o.pct==null?"—":sg(o.pct)+"%"));
      const dt=el("span","dt");dt.append(el("span",null,o.n+" 檔"));
      if(o.amt!=null){const t=el("span",cls(o.amt),`法人${o.amt>=0?"買超":"賣超"} ${fmt(Math.abs(o.amt)/1e8)} 億（占成交 ${sg(o.share,1)}%）`);dt.append(t)}else dt.append(el("span",null,"法人 —"));
      if(o.r5!=null)dt.append(el("span",cls(o.r5),"近5日 "+sg(o.r5)+"%"));
      if(o.vol!=null)dt.append(el("span",null,"量能 "+o.vol.toFixed(2)+" 倍"));
      b.append(dt);b.addEventListener("click",()=>{q.value=o.name;apply();q.scrollIntoView({block:"start",behavior:"smooth"})});rk.append(b)});
    const wait=metrics.filter(m=>!used.includes(m)).map(m=>m[1]);
    document.getElementById("rkh").textContent=`族群強弱排名（價格 ${pxDate?md(pxDate):"—"}${live?" 盤中":""}${inDate?"・法人 "+md(inDate):""}）`;
    document.getElementById("rkn").textContent=`排名綜合：${used.map(m=>m[1]).join("、")||"—"}。${wait.length?wait.join("、")+"尚在累積資料，之後自動納入。":""}這是已發生的數據，不是漲跌預測；族群只計入關注清單內的個股，法人金額為買賣超股數乘以收盤價的估算。`;
    for(const id of ["rkh","rk","rkn"])document.getElementById(id).hidden=false;
  })();
  // ── 搜尋 ──
  const q=document.getElementById("q"),hint=document.getElementById("hint"),none=el("p","todo","找不到符合的個股。可以試試公司名稱、股票代號、產業（如「記憶體」），或法說會日期（如 11/12）。");
  none.hidden=true;box.append(none);
  let opened=null;
  function apply(){
    const terms=norm(q.value).split(/\s+/).filter(Boolean);
    if(opened){opened.open=false;opened=null}
    if(!terms.length){rows.forEach(r=>r.d.hidden=false);Object.values(heads).forEach(h=>h.hidden=false);none.hidden=true;hint.textContent="";calDefault();return}
    const hit=rows.filter(r=>{const ok=terms.every(t=>{const k=dateKey(t);return r.hay.includes(t)||(k&&r.date.includes(k))});r.d.hidden=!ok;return ok});
    for(const g in heads)heads[g].hidden=!hit.some(r=>r.s.group===g);
    none.hidden=hit.length>0;
    hint.textContent=hit.length?`找到 ${hit.length} 檔`:"";
    const codes=new Set(hit.map(r=>r.s.code));
    drawCal(ev.filter(x=>codes.has(x.s.code)),"符合的法說會","符合的個股沒有已知的法說會日期");
    if(hit.length===1&&!hit[0].d.open){hit[0].d.open=true;opened=hit[0].d}
  }
  q.addEventListener("input",apply);
  q.addEventListener("keydown",e=>{if(e.key==="Enter")q.blur();if(e.key==="Escape"){q.value="";apply()}});
  if(q.value)apply();
})();
</script>
</body>
</html>
